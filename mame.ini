#
# MAME options for this project.
#
# MAME's default inipath includes "." , so every `mame` run started from this
# directory picks this file up automatically - including ad-hoc ones.
#
# The point of this file is that extraction runs must never take over the
# display. `video none` disables rendering entirely, and `videodriver dummy`
# stops the SDL layer from creating any window at all (on macOS `video none`
# alone still brings up a fullscreen surface).
#
# If you want to run Strider here interactively and actually SEE it, comment
# out the three lines below, or override on the command line:
#     mame strider -video auto -videodriver auto -window
#
video                     none
videodriver               dummy
window                    1

# never change the host display mode, and never maximise if a window is made
switchres                 0
maximize                  0
keepaspect                1
waitvsync                 0

# extraction paths
rompath                   roms
cfg_directory             tools/mame/cfg
nvram_directory           tools/mame/nvram
state_directory           tools/mame/sta
snapshot_directory        tools/mame/snap
diff_directory            tools/mame/diff
